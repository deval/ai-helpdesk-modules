# AI-Powered Helpdesk & Customer Service Workshop

### 3 days · ~6 hours/day · $0 cost — free tiers only

.footnote[Sample deck — built with remark.js, runs fully offline]

---

## What is an LLM?

A large language model is **not a database** — it doesn't "look up" answers.

--

It's a **statistical next-token predictor**: trained on huge amounts of text, it predicts the most likely next token given everything before it.

--

There is **no internal fact-checker** and no concept of "I don't know this."

--

An accurate answer and an invented one are produced by the **exact same mechanism**.

> An LLM optimizes for *plausible*, not *true*.

---

## Three levels of AI in support

| Level | What happens | Risk |
|---|---|---|
| **Ticket deflection** | Customer never reaches a human | Fails on account-specific state |
| **Agent-assist** | AI drafts, human approves | Safest place to start |
| **Full automation** | AI acts with no human step | Reserve for narrow, high-confidence cases only |

--

Most of this workshop's pipeline lives in **agent-assist**: the "draft → hold for review" pattern.

---

## Watch hallucination happen live

**Naive prompt:**

```
Reply to this customer complaint politely.
```

--

.fail[**Typical output (fails):**] "I've issued a full refund of $[amount]..."

— invents a refund amount and a policy decision **no one made**.

---

## Fix it: grounding

**Improved prompt** — adds rules + reference facts:

```
Rules:
- Only state facts present in the ticket or policy notes
- Do NOT promise a refund amount
- Acknowledge the specific complaint
```

--

.fix[**Resulting output:**] acknowledges the issue, states it qualifies for *review* — not a promised amount. **No invented facts.**

---

## Tool stack (all free)

| Tool | Role |
|---|---|
| Google NotebookLM | Source-grounded Q&A, knowledge base |
| n8n + Tailscale Funnel | Self-hosted automation, stable public URL |
| Groq API | Fast live prompt-tuning demo |
| Gemini API | Classify + draft replies inside n8n |
